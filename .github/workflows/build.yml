name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        id: build
        run: mvn -B package --file pom.xml > build_output.log 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Upload log via API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(base64 -w 0 build_output.log)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build_output.log" \
            | python3 -c "import json,sys
try:
    print(json.load(sys.stdin)['sha'])
except:
    print('')" 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            PAYLOAD="{\"message\": \"Update build log\", \"content\": \"$CONTENT\", \"sha\": \"$SHA\", \"branch\": \"main\"}"
          else
            PAYLOAD="{\"message\": \"Add build log\", \"content\": \"$CONTENT\", \"branch\": \"main\"}"
          fi
          echo "$PAYLOAD" > /tmp/payload.json
          curl -s -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build_output.log" \
            -d @/tmp/payload.json

      - name: Upload compiled plugin
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DynamicShop3-plugin
          path: target/*.jar

      - name: Fail job if build failed
        if: env.BUILD_FAILED == 'true'
        run: exit 1
