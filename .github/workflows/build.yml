name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        id: build
        run: mvn -B package --file pom.xml 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Commit build log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_output.log
          git commit -m "Add build log [skip ci]" || echo "Nothing to commit"
          git push

      - name: Upload compiled plugin
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DynamicShop3-plugin
          path: target/*.jar

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
